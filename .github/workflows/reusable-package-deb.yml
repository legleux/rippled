# This workflow builds a Debian package from a pre-built binary artifact.
name: Package DEB

on:
  workflow_call:
    inputs:
      artifact_name:
        description: "Name of the pre-built binary artifact to download."
        required: true
        type: string
      version:
        description: "Version string used for naming the output artifact."
        required: true
        type: string

defaults:
  run:
    shell: bash

env:
  BUILD_DIR: build
  IMAGE: ghcr.io/xrplf/ci/debian-bookworm:gcc-12

jobs:
  package-deb:
    name: DEB (${{ inputs.version }})
    runs-on: ["self-hosted", "Linux", "X64", "heavy"]
    container: ${{ env.IMAGE }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download pre-built binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ env.BUILD_DIR }}

      - name: Make binary executable
        run: chmod +x ${{ env.BUILD_DIR }}/xrpld

      - name: Setup Conan
        uses: ./.github/actions/setup-conan

      - name: Get number of processors
        uses: XRPLF/actions/get-nproc@cf0433aa74563aead044a1e395610c96d65a37cf
        id: nproc
        with:
          subtract: 2

      - name: Build dependencies
        uses: ./.github/actions/build-deps
        with:
          build_nproc: ${{ steps.nproc.outputs.nproc }}
          build_type: Release
          log_verbosity: quiet

      - name: Configure CMake
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          cmake \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH=build/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/xrpld \
            -Dxrpld=ON \
            -Dtests=OFF \
            ..

      - name: Build Debian package
        working-directory: ${{ env.BUILD_DIR }}
        run: cmake --build . --target package-deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: xrpld-deb-${{ inputs.version }}
          path: ${{ env.BUILD_DIR }}/debbuild/*.deb
          if-no-files-found: error
