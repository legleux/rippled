name: Build and push images

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      image_name:
        description: The full base name of the image e.g. ghcr.io/XRPLF/rippled
        type: string
        required: true
      publishing_repo:
        description: The repository that is allowed to publish.
        type: string
        required: true
      dockerfile:
        description: Alernative Dockerfile to use.
        type: string
        default: ci/docker/Dockerfile
        required: false
      latest_branch:
        description: The branch that receives the "latest" tag.
        type: string
        default: master
        required: false


jobs:
  build:
    name: ${{ matrix.arch }} image build
    if: github.repository == inputs.publishing_repo
    strategy:
      matrix:
        arch: [amd, arm]
    outputs:
      digest_name: ${{ steps.image_data.outputs.digest_name }}
    runs-on: ${{ matrix.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare labels and annotations
        id: image_data
        run: |
          digest_name="digest-${{ matrix.arch }}"
          echo "digest_name=${digest_name}" >> $GITHUB_OUTPUT

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ inputs.image_name }}
          labels: |
            org.opencontainers.image.authors=For inquiries, please use https://github.com/${{ github.repository }}/issues
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}.git
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.vendor=XRPLF

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v6
        with:
          file: ${{ inputs.dockerfile }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.arch }}
          cache-to:   type=gha,mode=max,scope=${{ github.ref_name }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: >
            type=image,
            name=${{ inputs.image_name }},
            push-by-digest=true,
            name-canonical=true,
            push=true
          platforms: linux/${{ matrix.arch }}64
          provenance: mode=max
          sbom: true
          push: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          set -eo pipefail
          d='${{ steps.build.outputs.digest }}'   # e.g. sha256:abcd...
          [[ -n "$d" ]] || { echo "empty digest"; exit 1; }
          printf '%s\n' "$d" > "/tmp/digests/digest-${{ matrix.arch }}"
          ls -lah /tmp/digests

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.image_data.outputs.digest_name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push to GHCR
    if: github.repository == inputs.publishing_repo
    env:
      DIGEST_NAME: ${{ needs.build.outputs.digest_name }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest-descriptor
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' && github.ref_name == inputs.latest_branch }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=long
            type=sha,prefix=,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        # This env var is required for the script to find the JSON output
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          # Exit on error, handle errors in functions, and error on unset variables
          set -Eeo pipefail

          ## 1. Prepare Tag Arguments
          # Read all tags from the metadata JSON into a bash array (TAGS)
          mapfile -t TAGS < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          # Convert them into a list of '-t' arguments (TARGS) for the docker command
          TARGS=()
          for t in "${TAGS[@]}"; do TARGS+=(-t "$t"); done

          ## 2. Prepare Annotation Arguments
          # Read all annotations from the metadata JSON
          mapfile -t ANN_LINES < <(jq -r '.annotations[]?' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          # Convert them into a list of '--annotation' arguments (ANN)
          ANN=()
          for a in "${ANN_LINES[@]}"; do ANN+=(--annotation "$a"); done

          ## 3. Prepare Source Arguments
          #
          # This is the most critical part. We can't trust the '.images[0]'
          # key from the metadata (as it was returning 'null').
          # Instead, we "discover" the correct base image name by looking
          # at the *first tag* that was generated. This correctly finds
          # the repo-scoped name (e.g., ghcr.io/owner/repo/image).
          GHCR_BASE=""
          for t in "${TAGS[@]}"; do
            # Find the first tag that is on ghcr.io
            [[ $t == ghcr.io/* ]] || continue
            # Strip the tag (e.g., :latest) to get the base name
            GHCR_BASE="${t%:*}"
            break
          done

          # Fail if we couldn't find a base name
          [[ -n "$GHCR_BASE" ]] || { echo "ERROR: No ghcr.io tag found in metadata."; exit 1; }

          # Now, find all the digest files uploaded by the build jobs
          SRC_REFS=()
          for f in /tmp/digests/digest-*; do
            [[ -s "$f" ]] || continue # Skip if file is empty
            d=$(<"$f") # Read the digest (sha256:...) from the file
            # Combine the base name and digest into the final format
            SRC_REFS+=("${GHCR_BASE}@${d}")
          done

          # Fail if we didn't find any digests
          [[ ${#SRC_REFS[@]} -gt 0 ]] || { echo "ERROR: No source digests found in /tmp/digests."; exit 1; }

          ## 4. Create and Push the Manifest
          # This is the final command that stitches everything together
          docker buildx imagetools create \
            "${TARGS[@]}" \
            "${ANN[@]}" \
            "${SRC_REFS[@]}"
